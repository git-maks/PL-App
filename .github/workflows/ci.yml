name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web — types, unit tests, demo E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: npm run gen:api && git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run check
      - run: npm test
      - name: Build demo
        run: npm run build
        env:
          PUBLIC_API_MODE: demo
      - name: Bundle budget (initial JS ≤ 80 kB gzip)
        run: node scripts/check-budget.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  api:
    name: API — vet, tests (PostgreSQL), vulnerabilities
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uniquest
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: uniquest_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uniquest" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l apps content)" || (gofmt -l apps content && exit 1)
      - run: go vet ./...
      - run: go test -race -p 1 ./...
        env:
          UQ_TEST_DATABASE_URL: postgres://uniquest@127.0.0.1:5432/uniquest_test?sslmode=disable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  fullstack:
    name: Full stack — Go backend + browser E2E
    runs-on: ubuntu-latest
    needs: [web, api]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uniquest
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: uniquest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uniquest" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: make e2e-fullstack
        env:
          DATABASE_URL: postgres://uniquest@127.0.0.1:5432/uniquest?sslmode=disable

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: uniquest:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
